# ============================================
# PolicyTrack - Docker Compose Configuration
# ============================================
# Usage:
#   Start:   docker-compose up -d
#   Stop:    docker-compose down
#   Rebuild: docker-compose up -d --build
#   Logs:    docker-compose logs -f
# ============================================

version: '3.8'

services:
  # PolicyTrack Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policytrack-app
    ports:
      - "8080:8080"
    environment:
      # Database connection settings
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=policytrack
      - DB_USER=${DB_USER:-policytrack}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - policytrack-network
    restart: unless-stopped

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: policytrack-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=policytrack
      - MYSQL_USER=${DB_USER:-policytrack}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      # Uncomment below to initialize database with SQL scripts
      # - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - policytrack-network
    restart: unless-stopped

networks:
  policytrack-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
